name: Verify evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m owner_state.verify_artifacts
      - name: Regenerate publication figures from raw evidence
        run: python -m owner_state.plot_figures --check
      - name: Check native hashes and inclusion relations
        run: |
          git clone https://github.com/ethereum/remerkleable.git local-runs/remerkleable
          git -C local-runs/remerkleable checkout --detach 2f0baeef0082d4278acaef7d822deb7009d7db7e
          PYTHONPATH=local-runs/remerkleable python -m unittest discover -s real_state -p 'test_*.py' -v
          python -m unittest test_analyze_fixtures -v
          python -m unittest discover -s owner_state -p 'test_*.py' -v
      - name: Check that verification leaves the evidence unchanged
        run: git diff --exit-code

  saved-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install the recorded Rust version
        run: |
          rustup default 1.97.1
          rustup component add rustfmt --toolchain 1.97.1
      - run: python -m real_state.run setup
      - name: Exercise the small Rust runner tests
        run: cargo test --manifest-path vendor/leanVM-b/Cargo.toml --locked --release --test real_state_bench
      - name: Build the profiled backend and check that the patch preserves proof work
        run: |
          python -m owner_state.run setup
          python -m unittest owner_state.test_instrumentation -v
      - name: Regenerate owner-binding inputs and verify the selected saved proofs
        run: |
          python -m owner_state.run generate
          python -m owner_state.verify_artifacts --generated
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          report = json.loads(Path('owner_state/evidence.json').read_text())['reports']['collect']
          subprocess.run([sys.executable, '-m', 'owner_state.run', 'verify', '--run', report], check=True)
          PY
      - run: git diff --exit-code
