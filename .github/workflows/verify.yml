name: Verify evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python verify_evidence.py
      - run: python -m real_state.verify_artifacts
      - name: Check native hashes and inclusion relations
        run: |
          git clone https://github.com/ethereum/remerkleable.git local-runs/remerkleable
          git -C local-runs/remerkleable checkout --detach 2f0baeef0082d4278acaef7d822deb7009d7db7e
          PYTHONPATH=local-runs/remerkleable python -m unittest discover -s real_state -p 'test_*.py' -v
      - name: Check that verification leaves the evidence unchanged
        run: git diff --exit-code

  saved-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Install the recorded Rust version
        run: rustup default 1.97.1
      - run: python -m real_state.run setup
      - name: Exercise the small Rust runner tests
        run: cargo test --manifest-path vendor/leanVM-b/Cargo.toml --locked --release --test real_state_bench
      - name: Regenerate public programs and compare their hashes
        run: |
          python -m real_state.run generate
          python -m real_state.verify_artifacts --generated
      - name: Verify saved proofs without witness files
        run: python -m real_state.run verify --saved-proof real_state/proofs
      - run: git diff --exit-code
