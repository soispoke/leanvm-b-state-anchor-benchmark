<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Structural cost of authenticated state claims</title>
<desc id="desc">Panel a shows modeled bridge overhead at mainnet block 25,939,968: direct state root plus 0 calls, draft EIP-7807 block root plus 5, and the available current block hash plus 20 for this 634 byte RLP header. Panel b shows direct state root path counts: Plain account 125, Safe account + slot 0 141, Safe singleton + owner + threshold 151, WETH balance 220, Tornado current index + root 248, BAYC token 100 owner 305, WETH + BAYC token 100 508, ETH + WETH + BAYC token 100 616. Publishing the exact Tornado root gives an application specific shortcut of zero modeled state path calls. Multi-claim rows hash identical encoded trie nodes once as a deduplication model, not an implemented multiproof. All values exclude parsing, trie routing, actual Keccak and SHA-256 costs, private spend logic, time, and gas.</desc>
<defs>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#202124"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#0072B2"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="60" y="60" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="60" dy="0">Structural cost of authenticated state claims</tspan></text><text x="60" y="125" text-anchor="start" fill="#202124" font-size="28" font-weight="600" font-style="normal"><tspan x="60" dy="0">a</tspan></text><text x="105" y="125" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="105" dy="0">Bridge overhead at the pinned block</tspan></text><text x="105" y="158" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="105" dy="0">add one value to each row in panel b</tspan></text><text x="105" y="225" text-anchor="start" fill="#202124" font-size="23" font-weight="500" font-style="normal"><tspan x="105" dy="0">Direct state root</tspan></text><text x="105" y="253" text-anchor="start" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="105" dy="0">hypothetical exposure</tspan></text><line x1="105" y1="295" x2="535" y2="295" stroke="#E8EAED" stroke-width="3"/><circle cx="110" cy="295" r="8" fill="#0072B2"/><text x="133" y="304" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="133" dy="0">+0</tspan></text><text x="105" y="365" text-anchor="start" fill="#202124" font-size="23" font-weight="500" font-style="normal"><tspan x="105" dy="0">EIP-7807 block root</tspan></text><text x="105" y="393" text-anchor="start" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="105" dy="0">draft</tspan></text><line x1="105" y1="435" x2="535" y2="435" stroke="#E8EAED" stroke-width="3"/><rect x="105" y="416" width="107.5" height="38" fill="#6F4C9B"/><text x="226.5" y="444" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="226.5" dy="0">+5</tspan></text><text x="105" y="505" text-anchor="start" fill="#202124" font-size="23" font-weight="500" font-style="normal"><tspan x="105" dy="0">Current RLP block hash</tspan></text><text x="105" y="533" text-anchor="start" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="105" dy="0">available; 634 byte header here</tspan></text><line x1="105" y1="575" x2="535" y2="575" stroke="#E8EAED" stroke-width="3"/><rect x="105" y="556" width="430.0" height="38" fill="#C44E00"/><text x="549.0" y="584" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="549.0" dy="0">+20</tspan></text><rect x="85" y="675" width="480" height="150" rx="10" fill="#DDF3EB" stroke="#008C6A" stroke-width="3"/><text x="105" y="704" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="105" dy="0">APPLICATION SPECIFIC SHORTCUT</tspan></text><text x="325.0" y="740" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="325.0" dy="0">Published Tornado root</tspan><tspan x="325.0" dy="30.0">0 modeled state path calls</tspan><tspan x="325.0" dy="30.0">registry check and private spend excluded</tspan></text><text x="105" y="865" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="105" dy="0">This shortcut authenticates only that exact application root.</tspan><tspan x="105" dy="26.25">It does not expose arbitrary Ethereum state.</tspan></text><text x="650" y="125" text-anchor="start" fill="#202124" font-size="28" font-weight="600" font-style="normal"><tspan x="650" dy="0">b</tspan></text><text x="695" y="125" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="695" dy="0">State path from a direct state root</tspan></text><text x="695" y="158" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="695" dy="0">one pinned mainnet snapshot</tspan></text><text x="1715" y="158" text-anchor="end" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="1715" dy="0">total = plotted value + panel a</tspan></text><line x1="1035.0" y1="896" x2="1035.0" y2="904" stroke="#202124" stroke-width="2"/><text x="1035.0" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1035.0" dy="0">0</tspan></text><line x1="1132.857142857143" y1="896" x2="1132.857142857143" y2="904" stroke="#202124" stroke-width="2"/><text x="1132.857142857143" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1132.857142857143" dy="0">100</tspan></text><line x1="1230.7142857142858" y1="896" x2="1230.7142857142858" y2="904" stroke="#202124" stroke-width="2"/><text x="1230.7142857142858" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1230.7142857142858" dy="0">200</tspan></text><line x1="1328.5714285714284" y1="896" x2="1328.5714285714284" y2="904" stroke="#202124" stroke-width="2"/><text x="1328.5714285714284" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1328.5714285714284" dy="0">300</tspan></text><line x1="1426.4285714285716" y1="896" x2="1426.4285714285716" y2="904" stroke="#202124" stroke-width="2"/><text x="1426.4285714285716" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1426.4285714285716" dy="0">400</tspan></text><line x1="1524.2857142857142" y1="896" x2="1524.2857142857142" y2="904" stroke="#202124" stroke-width="2"/><text x="1524.2857142857142" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1524.2857142857142" dy="0">500</tspan></text><line x1="1622.142857142857" y1="896" x2="1622.142857142857" y2="904" stroke="#202124" stroke-width="2"/><text x="1622.142857142857" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1622.142857142857" dy="0">600</tspan></text><line x1="1720.0" y1="896" x2="1720.0" y2="904" stroke="#202124" stroke-width="2"/><text x="1720.0" y="927" text-anchor="middle" fill="#5F6368" font-size="20" font-weight="400" font-style="normal"><tspan x="1720.0" dy="0">700</tspan></text><text x="1010" y="244" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">Plain account</tspan></text><line x1="1035" y1="237" x2="1157.3214285714287" y2="237" stroke="#0072B2" stroke-width="8"/><circle cx="1157.3214285714287" cy="237" r="9" fill="#0072B2"/><text x="1173.3214285714287" y="245" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1173.3214285714287" dy="0">125</tspan></text><text x="1010" y="332" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">Safe account + slot 0</tspan></text><line x1="1035" y1="325" x2="1172.9785714285715" y2="325" stroke="#0072B2" stroke-width="8"/><circle cx="1172.9785714285715" cy="325" r="9" fill="#0072B2"/><text x="1188.9785714285715" y="333" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1188.9785714285715" dy="0">141</tspan></text><text x="1010" y="420" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">Safe singleton + owner + threshold</tspan></text><line x1="1035" y1="413" x2="1182.7642857142857" y2="413" stroke="#0072B2" stroke-width="8"/><circle cx="1182.7642857142857" cy="413" r="9" fill="#0072B2"/><text x="1198.7642857142857" y="421" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1198.7642857142857" dy="0">151</tspan></text><text x="1010" y="508" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">WETH balance</tspan></text><line x1="1035" y1="501" x2="1250.2857142857142" y2="501" stroke="#0072B2" stroke-width="8"/><circle cx="1250.2857142857142" cy="501" r="9" fill="#0072B2"/><text x="1266.2857142857142" y="509" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1266.2857142857142" dy="0">220</tspan></text><text x="1010" y="596" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">Tornado current index + root</tspan></text><line x1="1035" y1="589" x2="1277.6857142857143" y2="589" stroke="#0072B2" stroke-width="8"/><circle cx="1277.6857142857143" cy="589" r="9" fill="#0072B2"/><text x="1293.6857142857143" y="597" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1293.6857142857143" dy="0">248</tspan></text><text x="1010" y="684" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">BAYC token 100 owner</tspan></text><line x1="1035" y1="677" x2="1333.4642857142858" y2="677" stroke="#0072B2" stroke-width="8"/><circle cx="1333.4642857142858" cy="677" r="9" fill="#0072B2"/><text x="1349.4642857142858" y="685" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1349.4642857142858" dy="0">305</tspan></text><text x="1010" y="772" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">WETH + BAYC token 100</tspan></text><line x1="1035" y1="765" x2="1532.1142857142856" y2="765" stroke="#0072B2" stroke-width="8"/><circle cx="1532.1142857142856" cy="765" r="9" fill="#0072B2"/><text x="1548.1142857142856" y="773" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1548.1142857142856" dy="0">508</tspan></text><text x="1010" y="860" text-anchor="end" fill="#202124" font-size="21" font-weight="400" font-style="normal"><tspan x="1010" dy="0">ETH + WETH + BAYC token 100</tspan></text><line x1="1035" y1="853" x2="1637.8" y2="853" stroke="#0072B2" stroke-width="8"/><circle cx="1637.8" cy="853" r="9" fill="#0072B2"/><text x="1653.8" y="861" text-anchor="start" fill="#202124" font-size="21" font-weight="600" font-style="normal"><tspan x="1653.8" dy="0">616</tspan></text><line x1="1035" y1="896" x2="1720" y2="896" stroke="#202124" stroke-width="2"/><text x="1377.5" y="966" text-anchor="middle" fill="#202124" font-size="23" font-weight="400" font-style="normal"><tspan x="1377.5" dy="0">Modeled native BLAKE3 calls</tspan></text><text x="60" y="1004" text-anchor="start" fill="#5F6368" font-size="19" font-weight="400" font-style="normal"><tspan x="60" dy="0">Deterministic structural counts from block 25,939,968. No error bars: this is one snapshot, not a population estimate.</tspan></text><text x="60" y="1037" text-anchor="start" fill="#5F6368" font-size="19" font-weight="400" font-style="normal"><tspan x="60" dy="0">Multi-claim rows hash identical encoded trie nodes once. This is a deduplication model, not an implemented multiproof.</tspan></text><text x="60" y="1070" text-anchor="start" fill="#5F6368" font-size="19" font-weight="400" font-style="normal"><tspan x="60" dy="0">Keccak and SHA-256 are replaced uniformly with BLAKE3. Parsing, trie routing, private spend logic, time, and gas are excluded.</tspan></text></g>
</svg>
