<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Mechanism and benchmark scope</title>
<desc id="desc">Panel a is a conceptual private spend with separate note and Ethereum state branches linked by one hidden owner address; it was not implemented. Panel b shows the actual unrelated mainnet examples: a Tornado account, index, and root proof modeled at 248 calls, and a Safe account plus slot zero proof shape modeled at 141 calls. Python validates real Keccak proofs and the RLP header. leanVM-b runs 24 serial BLAKE3 chains, whose calibration timing is reported separately. No private relation, end to end private proof time, or gas is measured.</desc>
<defs>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#202124"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#0072B2"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="60" y="60" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="60" dy="0">Mechanism and benchmark scope</tspan></text><text x="60" y="98" text-anchor="start" fill="#5F6368" font-size="22" font-weight="400" font-style="normal"><tspan x="60" dy="0">The intended private relation is conceptual. The experiment validates real Ethereum proofs and runs only modeled hash counts in leanVM-b.</tspan></text><line x1="900" y1="140" x2="900" y2="970" stroke="#E8EAED" stroke-width="3"/><text x="60" y="155" text-anchor="start" fill="#202124" font-size="28" font-weight="600" font-style="normal"><tspan x="60" dy="0">a</tspan></text><text x="105" y="155" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="105" dy="0">Target private spend relation</tspan></text><text x="105" y="186" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="105" dy="0">not implemented</tspan></text><rect x="70" y="230" width="350" height="100" rx="10" fill="#DDF3EB" stroke="#008C6A" stroke-width="3"/><text x="90" y="259" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="90" dy="0">PUBLIC INPUT</tspan></text><text x="245.0" y="295" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="245.0" dy="0">Pool root</tspan></text><rect x="500" y="230" width="350" height="100" rx="10" fill="#DCEEF8" stroke="#0072B2" stroke-width="3"/><text x="520" y="259" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="520" dy="0">PUBLIC INPUT</tspan></text><text x="675.0" y="295" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="675.0" dy="0">Execution state root</tspan></text><line x1="245" y1="330" x2="245" y2="395" stroke="#202124" stroke-width="3" marker-end="url(#arrow-ink)"/><line x1="675" y1="330" x2="675" y2="395" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="55" y="395" width="380" height="145" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="3" stroke-dasharray="10 8"/><text x="75" y="424" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="75" dy="0">HYPOTHETICAL</tspan></text><text x="245.0" y="460" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="245.0" dy="0">Prove note membership</tspan><tspan x="245.0" dy="30.0">cm = H(owner_addr, secret, …)</tspan></text><rect x="480" y="395" width="390" height="145" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="3" stroke-dasharray="10 8"/><text x="500" y="424" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="500" dy="0">HYPOTHETICAL</tspan></text><text x="675.0" y="460" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="675.0" dy="0">Prove account and storage</tspan><tspan x="675.0" dy="30.0">owner_addr → H(verification key)</tspan></text><text x="460" y="620" text-anchor="middle" fill="#202124" font-size="22" font-weight="600" font-style="normal"><tspan x="460" dy="0">Both statements use the same hidden owner_addr</tspan></text><line x1="245" y1="540" x2="345" y2="690" stroke="#202124" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-ink)"/><line x1="675" y1="540" x2="575" y2="690" stroke="#202124" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-ink)"/><rect x="195" y="690" width="530" height="125" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="3" stroke-dasharray="10 8"/><text x="215" y="719" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="215" dy="0">NOT IMPLEMENTED</tspan></text><text x="460.0" y="755" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="460.0" dy="0">Authorize the complete transaction</tspan><tspan x="460.0" dy="30.0">then expose nullifier and outputs</tspan></text><text x="80" y="885" text-anchor="start" fill="#5F6368" font-size="22" font-weight="400" font-style="normal"><tspan x="80" dy="0">The pool root and state root authenticate separate claims.</tspan><tspan x="80" dy="27.5">A private proof must link them without revealing owner_addr.</tspan></text><text x="935" y="155" text-anchor="start" fill="#202124" font-size="28" font-weight="600" font-style="normal"><tspan x="935" dy="0">b</tspan></text><text x="980" y="155" text-anchor="start" fill="#202124" font-size="24" font-weight="600" font-style="normal"><tspan x="980" dy="0">What the experiment ran</tspan></text><text x="980" y="186" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="980" dy="0">two examples from eight benchmark cases</tspan></text><rect x="970" y="230" width="740" height="125" rx="10" fill="#DDF3EB" stroke="#008C6A" stroke-width="3"/><text x="990" y="259" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="990" dy="0">REAL MAINNET PROOF</tspan></text><text x="1340.0" y="295" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="1340.0" dy="0">Tornado account + current index + root slot</tspan><tspan x="1340.0" dy="30.0">248 modeled calls from a direct state root</tspan></text><rect x="970" y="395" width="740" height="125" rx="10" fill="#DCEEF8" stroke="#0072B2" stroke-width="3"/><text x="990" y="424" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="990" dy="0">REAL MAINNET PROOF</tspan></text><text x="1340.0" y="460" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="1340.0" dy="0">Safe account + slot 0 proof shape</tspan><tspan x="1340.0" dy="30.0">141 modeled calls; slot holds a singleton, not H(vk)</tspan></text><rect x="970" y="590" width="350" height="155" rx="10" fill="#DDF3EB" stroke="#008C6A" stroke-width="3"/><text x="990" y="619" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="990" dy="0">PYTHON VALIDATION</tspan></text><text x="1145.0" y="655" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="1145.0" dy="0">Real Keccak MPT</tspan><tspan x="1145.0" dy="30.0">and RLP header</tspan><tspan x="1145.0" dy="30.0">101 mutations rejected</tspan></text><rect x="1360" y="590" width="350" height="155" rx="10" fill="#DCEEF8" stroke="#0072B2" stroke-width="3"/><text x="1380" y="619" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="1380" dy="0">LEANVM-B EXECUTION</tspan></text><text x="1535.0" y="655" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="1535.0" dy="0">24 serial BLAKE3 chains</tspan><tspan x="1535.0" dy="30.0">count and output</tspan><tspan x="1535.0" dy="30.0">checks passed</tspan></text><rect x="970" y="815" width="740" height="130" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="3" stroke-dasharray="10 8"/><text x="990" y="844" text-anchor="start" fill="#202124" font-size="20" font-weight="600" font-style="normal"><tspan x="990" dy="0">SCOPE</tspan></text><text x="1340.0" y="880" text-anchor="middle" fill="#202124" font-size="24" font-weight="500" font-style="normal"><tspan x="1340.0" dy="0">No note membership, hidden owner link, authorization, or gas</tspan><tspan x="1340.0" dy="30.0">No end to end private proof timing</tspan></text><text x="60" y="1045" text-anchor="start" fill="#5F6368" font-size="21" font-weight="400" font-style="normal"><tspan x="60" dy="0">Panel a is an architecture sketch. Panel b shows two structural examples; Figure 2 reports all eight cases.</tspan><tspan x="60" dy="26.25">Repeated leanVM-b calibration timing is reported in Figure 3.</tspan></text></g>
</svg>
